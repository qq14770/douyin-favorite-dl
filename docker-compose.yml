# =============================================================================
#  抖音「喜欢视频」批量下载 · Web 面板  —— 飞牛OS (fnOS) / NAS Docker 部署
# =============================================================================
# ⚠️ 容器一直显示「重启中」？先看这里：
#     docker compose logs --tail=50      （或飞牛界面：容器 → 信息监控）
#   最常见原因是 volumes 左边那个目录不存在或不可写。检查并创建：
#     ls -ld "/vol1/1000/影视/抖音/喜欢" || mkdir -p "/vol1/1000/影视/抖音/喜欢"
#   确认代码已是最新版本（本版本对目录不可写做了容错，不会再因此崩溃重启）。
#
# 使用方法（二选一）
#
# 方式一：飞牛OS 图形界面
#   1. 把整个 tools/dy_favorite_dl 文件夹放到飞牛任意目录（例如 /vol1/1000/docker/dy-liked-dl）
#   2. 飞牛「Docker」→「Compose」→ 新建项目，把本文件内容粘进去
#   3. 修改下面的磁盘路径为自己的飞牛目录 → 部署
#   4. 浏览器打开 http://飞牛IP:8090
#
# 方式二：SSH 命令行
#   cd /vol1/1000/docker/dy-liked-dl
#   docker compose up -d --build
#   docker compose logs -f --tail=50
#
# 飞牛存储路径一般形如：/vol1/1000/<你的文件夹>   （/vol1、/vol2 为存储空间）
# ⚠️ 只需要改下面 volumes 里冒号【左边】的路径，右边 /app/data 不要动。
#
# ── 从 Windows 平移过来时的 3 个要点 ──────────────────────────────────
#  1) 输出目录在容器里固定是 /app/data，网页「配置」里看到的也应该是 /app/data；
#     Windows 那个 D:\抖音\喜欢 不会被带过来（容器读的是 /app/data/config.json）。
#  2) 端口默认已改为 8090（容器内外一致）。
#  3) 全部功能与 Windows 版一致，可直接平移。
# =============================================================================

services:
  dy-liked-dl:
    build: .
    # 也可以提前构建好镜像后用镜像名（在 Windows 上 build + save，再 docker load 进来）：
    # build: .
    # image: dy-liked-dl:latest
    container_name: dy-liked-dl
    restart: unless-stopped      # 必须常驻，否则「定时任务」到点没人执行

    # ★ 运行用户：默认关闭（root 运行最不容易出错）。
    #   如果你在飞牛文件管理器里删不掉下载的视频，再启用下面这行，
    #   并把 UID 改成你自己的（SSH 里执行  id 你的用户名  查询，飞牛首个用户通常是 1000）。
    #   启用后若容器起不来（一直"重启中"），多半是该目录属主对不上，
    #   处理：chown -R 1000:1000 "/vol1/1000/影视/抖音/喜欢"
    # user: "1000:1000"

    ports:
      - "8090:8090"          # 左边是飞牛对外端口，冲突就改成 18090 等

    # ★★★ DNS：飞牛/群晖等 NAS 的宿主机 resolv.conf 常指向 127.0.0.53
    #   （systemd-resolved 桩服务），容器访问不到它 → 解析域名必然超时，
    #   表现为日志里报 <urlopen error [Errno -3] Try again>。
    #   这里显式指定公共 DNS 即可根治。换成你自己的内网 DNS 也可以。
    dns:
      - 223.5.5.5          # 阿里公共 DNS
      - 119.29.29.29       # 腾讯 DNSPod
      - 114.114.114.114    # 114DNS

    environment:
      - TZ=Asia/Shanghai     # 定时任务按北京时间触发，勿删
      - PORT=8090
      - OUT_DIR=/app/data
      # ★ 访问密码：强烈建议设置（未设密码时，同一局域网任何人打开网页都能
      #   读到你的完整 Cookie、删除文件、发起下载）。支持任意特殊字符。
      #   取消下面这行注释并改成你自己的密码，然后 docker compose up -d
      # - PASS=改成你的密码

    volumes:
      # ★★★ 只改左边 ★★★  左边=飞牛上的真实目录，右边=容器内目录(勿改)
      # 视频、配置、状态都存这里，删除容器数据不丢
      #
      # ⚠️ 网页「配置 → 输出目录」必须填右边的 /app/data，绝不能填左边这个宿主机路径！
      #    例：上面这行左边写 /vol1/1000/影视/抖音/喜欢，那么网页里就填 /app/data。
      #    填成宿主机路径的话，文件会写进容器内部，飞牛文件管理器里永远看不到。
      - /vol1/1000/影视/抖音/喜欢:/app/data
      # 让容器时间跟随飞牛主机
      - /etc/localtime:/etc/localtime:ro

    # 内存限制（可选；纯标准库、下载单线程，512m 足够）
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512m

# =============================================================================
# 部署完成后
#   1. 打开 http://飞牛IP:8090
#   2. 进入「配置」：填 sec_user_id、粘贴完整 Cookie，确认输出目录是 /app/data
#   3. 点「保存并开始」→ 切到「内容列表」看进度；「运行日志」看实时日志
#   4. 视频直接落在你映射的飞牛目录，可在飞牛文件管理器 / Emby / Jellyfin 中直接看
#   5. 需要自动同步：到「定时任务」页加一条（开始/结束时间 + 重复星期），勾「启用」后保存
#
# 常见问题
#   - 返回 blocked：Cookie 缺 ttwid，工具会自动补齐；仍失败就重新复制浏览器完整 Cookie
#   - 文件在飞牛里删不掉：user 的 UID 不对，改成你实际的 UID
#   - 定时任务没触发：容器是否在运行？飞牛系统时间是否正确？（docker logs dy-liked-dl 看启动日志）
#   - 想换端口：改 ports 左边即可
#   - 忘记密码：改 compose 里 PASS 后 docker compose up -d，或删掉 /app/data/config.json 的 password 字段
#   - ⚠️ 安全：未设密码时，同一局域网任何人打开网页都能读到你的完整 Cookie 并删文件，务必设密码
# =============================================================================
